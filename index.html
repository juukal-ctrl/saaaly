<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api.open-meteo.com https://geocoding-api.open-meteo.com https://api.bigdatacloud.net https://nominatim.openstreetmap.org https://generativelanguage.googleapis.com https://api.met.no https://raw.githubusercontent.com; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>SääÄly</title>
<meta name="description" content="SääÄly kertoo yhdellä silmäyksellä, tarvitsetko takin tai sateenvarjon. Se yhdistää usean säämallin ennusteen ja selittää sään suomeksi.">
<meta name="theme-color" content="#0b1530">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SääÄly">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="scrim" aria-hidden="true"></div>

<main id="app">
  <h1 class="sr-only">SääÄly</h1>
  <header class="top">
    <button id="placeBtn" class="place" type="button" data-act="open-search" aria-haspopup="dialog" aria-label="Vaihda paikkakuntaa"></button>
    <div class="top-actions">
      <button class="icon-btn" type="button" data-act="locate" aria-label="Käytä sijaintiani"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
      <button id="refreshBtn" class="icon-btn" type="button" data-act="refresh" aria-label="Päivitä sää"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.4 5.7"/><path d="M20 4v7h-7"/></svg></button>
      <button class="icon-btn" type="button" data-act="open-settings" aria-label="Asetukset"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M18 7h2M4 17h2M11 17h9"/><circle cx="15.5" cy="7" r="2.3"/><circle cx="8.5" cy="17" r="2.3"/></svg></button>
    </div>
  </header>

  <div id="banner" class="banner" role="status" aria-live="polite" hidden></div>
  <div id="update" class="banner" role="status" aria-live="polite" hidden></div>

  <section id="welcome" class="welcome" aria-label="Aloitus" hidden></section>
  <section id="alerts" class="alerts" aria-label="Säähuomiot" hidden></section>
  <section id="hero" class="hero" aria-label="Sää nyt"></section>
  <section id="verdict" class="verdict" aria-label="Mitä päälle ja mukaan" hidden></section>
  <section id="heroRest" class="hero hero-rest" aria-label="Sään lisätiedot" hidden></section>
  <section id="ai" class="ai" aria-label="Tekoälyn selitys" hidden></section>
  <div id="forecast" class="panel" hidden>
    <section id="meteo" class="meteo" aria-label="Sääkaavio"></section>
    <section id="hourly" aria-label="Tuntiennuste"></section>
    <section id="daily" aria-label="Päiväennuste"></section>
    <section id="models" aria-label="Mallivertailu"></section>
  </div>

  <footer class="foot">
    <p>Sääennusteet: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a> (CC BY 4.0), jonka kautta mm. ECMWF, DWD, MET Norway ja UK Met Office. Yhdistelmä, sateen ajoitus ja neuvot ovat SääÄlyn omaa laskentaa.</p>
    <p>Kokeiluversio. Tärkeissä päätöksissä ja vaaratilanteissa katso <a href="https://www.ilmatieteenlaitos.fi/varoitukset" target="_blank" rel="noopener">Ilmatieteen laitoksen varoitukset</a>. <button class="linkish" type="button" data-act="open-about">Tietoja ja tietolähteet</button></p>
  </footer>
</main>

<div id="fab" class="askbar"><button class="ask-btn" type="button" data-act="open-chat" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg><span>Kysy SääÄlyltä…</span><svg class="go" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l16-8-6 16-3-7z"/></svg></button></div>

<div id="ptr" class="ptr" aria-hidden="true" hidden><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.4 5.7"/><path d="M20 4v7h-7"/></svg></div>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-backdrop" data-act="close"></div>
  <div id="sheetPanel" class="sheet-panel" role="dialog" aria-modal="true" tabindex="-1"></div>
</div>

<noscript><p class="nojs">SääÄly tarvitsee JavaScriptin toimiakseen.</p></noscript>

<script src="crash.js"></script>
<script src="saaaly.js" defer></script>
</body>
</html>
