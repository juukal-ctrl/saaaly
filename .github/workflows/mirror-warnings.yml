# Peilaa Ilmatieteen laitoksen säävaroitukset sovellukselle.
#
# Selain ei voi hakea varoitussyötettä (alerts.fmi.fi) suoraan, koska palvelu ei salli sitä (CORS). Tämä ajo hakee syötteen,
# tiivistää sen (src/tools/mirror-warnings.mjs) ja julkaisee tuloksen repon haaraan warnings-data, josta sovellus lukee sen
# (raw.githubusercontent.com). Haara tehdään joka kerta uudelleen yhdeksi commitiksi, joten historia ei kasva.
# Epäonnistunut haku ei muuta mitään: edellinen peili jää voimaan, ja sovellus ohittaa yli kuusi tuntia vanhan peilin itse.
# Ajo ei myöskään "epäonnistu" ulkoisen palvelun vian takia, jottei GitHub lähetä sähköpostia joka neljännestunti.
#
# GitHub poistaa ajastetut ajot käytöstä, jos repossa ei ole ollut toimintaa 60 päivään. Jos varoitukset katoavat sovelluksesta,
# avaa repon Actions-välilehti ja käynnistä tämä ajo uudelleen (Run workflow).
name: Peilaa säävaroitukset

on:
  schedule:
    - cron: '7,22,37,52 * * * *' # neljännestunnin välein, ei tasatunnilla, jolloin GitHubin jonot ovat pisimmillään
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mirror-warnings.yml'
      - 'src/tools/mirror-warnings.mjs'
      - 'src/js/warnings.js'

permissions:
  contents: write

concurrency:
  group: mirror-warnings
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Hae syöte ja tee peili
        run: node src/tools/mirror-warnings.mjs "$RUNNER_TEMP/warnings.json" --soft

      - name: Julkaise peili haaraan warnings-data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -s "$RUNNER_TEMP/warnings.json" ]; then
            echo "::warning title=Varoitusten peilaus::Uutta peiliä ei syntynyt, edellinen jää voimaan"
            exit 0
          fi
          dir="$RUNNER_TEMP/data"
          mkdir -p "$dir"
          cp "$RUNNER_TEMP/warnings.json" "$dir/warnings.json"
          cd "$dir"
          git init -q -b warnings-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add warnings.json
          git commit -q -m "Säävaroitukset $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" warnings-data
